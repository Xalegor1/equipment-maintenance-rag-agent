<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#111">Архитектура: запрос → агент → данные</text>

  <rect x="40" y="80" width="160" height="70" rx="8" fill="#eef2f7" stroke="#9bb0c7"/>
  <text x="120" y="112" text-anchor="middle" font-size="14" fill="#111">Streamlit UI</text>
  <text x="120" y="132" text-anchor="middle" font-size="12" fill="#555">или curl / API</text>

  <rect x="260" y="80" width="160" height="70" rx="8" fill="#eef2f7" stroke="#9bb0c7"/>
  <text x="340" y="112" text-anchor="middle" font-size="14" fill="#111">FastAPI</text>
  <text x="340" y="132" text-anchor="middle" font-size="12" fill="#555">валидация, роуты</text>

  <rect x="480" y="70" width="240" height="90" rx="8" fill="#e8f3ec" stroke="#79a888"/>
  <text x="600" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#111">LLM-агент (ReAct)</text>
  <text x="600" y="122" text-anchor="middle" font-size="12" fill="#333">план → вызов инструмента</text>
  <text x="600" y="142" text-anchor="middle" font-size="12" fill="#333">→ ответ с цитатой</text>

  <rect x="480" y="220" width="240" height="70" rx="8" fill="#f7f1e6" stroke="#c8ab7c"/>
  <text x="600" y="250" text-anchor="middle" font-size="13" fill="#111">tool: search_documentation</text>
  <text x="600" y="270" text-anchor="middle" font-size="11" fill="#555">гибридный поиск по регламентам</text>

  <rect x="480" y="320" width="240" height="70" rx="8" fill="#f7f1e6" stroke="#c8ab7c"/>
  <text x="600" y="350" text-anchor="middle" font-size="13" fill="#111">tool: query_equipment_db</text>
  <text x="600" y="370" text-anchor="middle" font-size="11" fill="#555">даты ТО, параметры, просрочка</text>

  <rect x="300" y="420" width="420" height="66" rx="8" fill="#eef2f7" stroke="#9bb0c7"/>
  <text x="510" y="450" text-anchor="middle" font-size="13" fill="#111">PostgreSQL + pgvector</text>
  <text x="510" y="470" text-anchor="middle" font-size="11" fill="#555">document_chunks (HNSW, tsvector) · equipment</text>

  <rect x="790" y="220" width="130" height="70" rx="8" fill="#f3f3f3" stroke="#bdbdbd"/>
  <text x="855" y="250" text-anchor="middle" font-size="12" fill="#111">OpenAI API</text>
  <text x="855" y="270" text-anchor="middle" font-size="11" fill="#555">chat + embeddings</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7c90"/>
    </marker>
  </defs>

  <line x1="200" y1="115" x2="258" y2="115" stroke="#6b7c90" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="420" y1="115" x2="478" y2="115" stroke="#6b7c90" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="160" x2="600" y2="218" stroke="#6b7c90" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="160" x2="600" y2="318" stroke="#6b7c90" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="290" x2="600" y2="318" stroke="#6b7c90" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="390" x2="600" y2="418" stroke="#6b7c90" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="720" y1="255" x2="788" y2="255" stroke="#6b7c90" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
