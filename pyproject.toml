[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isppr-maintenance"
version = "0.1.0"
description = "Интеллектуальная ИСППР по техническому обслуживанию оборудования на основе LLM-агента и RAG"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.25,<1.0",
    "langchain-openai>=0.3.16,<1.0",
    "langchain-community>=0.3.27,<1.0",
    "langchain-text-splitters>=0.3.9,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "psycopg-pool>=3.2,<4.0",
    "pgvector>=0.3.6,<0.5",
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.27",
    "streamlit>=1.45.1",
    "openai>=1.68.2,<2.0",
    "pypdf>=5.4.0",
    "pydantic-settings>=2.9.1",
    "pydantic>=2.12.0",
    "ragas>=0.2.15,<0.3",
    "pyyaml>=6.0.2",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.1.0",
    "ruff>=0.11.8",
    "mypy>=1.15.0",
    "python-dotenv>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
disable_error_code = ["call-arg", "import-untyped"]
