run_name: chunk256-top4
model: gpt-4o-mini
embedding_model: text-embedding-3-small
chunk_size: 256
chunk_overlap: 50
top_k: 4
metrics:
  - faithfulness
  - answer_relevancy
  - context_recall
  - context_precision
thresholds:
  faithfulness: 0.40
  answer_relevancy: 0.50
  context_recall: 0.35
  context_precision: 0.55
